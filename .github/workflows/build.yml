name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build 26.3
        run: ./gradlew build --no-daemon
      - name: Build 1.21.11
        run: ./gradlew -p mc1.21.11 build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-jars
          path: |
            build/libs/*.jar
            mc1.21.11/build/libs/*.jar
