plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
        content { includeGroup "com.terraformersmc" }
    }
}

loom {
    splitEnvironmentSourceSets()

    // ./gradlew runClient -Pbench=FerrumTest [-PbenchLabel=baseline] [-PbenchSeconds=60]
    if (project.hasProperty("bench")) {
        runs {
            client {
                vmArg "-Dferrum.benchmark=${project.property("bench")}"
                vmArg "-Dferrum.benchmark.label=${project.findProperty("benchLabel") ?: ""}"
                vmArg "-Dferrum.benchmark.seconds=${project.findProperty("benchSeconds") ?: "60"}"
                if (project.hasProperty("benchProfile")) {
                    vmArg "-XX:StartFlightRecording=settings=profile,filename=${project.property("benchProfile")},dumponexit=true"
                }
            }
        }
    }

    mods {
        "ferrum" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def props = [
        version: project.version,
        minecraft_dependency: project.minecraft_dependency,
        java_dependency: project.java_dependency,
        contact: ferrumContactJson()
    ]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName
    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}


// Version-independent code shared with mc1.21.11/
sourceSets.client.java.srcDir 'common/src/client/java'

// fabric.mod.json "contact" block, built from gradle.properties so no placeholder URLs ship.
def ferrumContactJson() {
    def entries = []
    ["homepage": "mod_homepage", "sources": "mod_sources", "issues": "mod_issues"].each { key, prop ->
        def value = project.findProperty(prop)?.toString()?.trim()
        if (value) {
            entries << "\"${key}\": \"${value}\""
        }
    }
    return "{" + entries.join(", ") + "}"
}
